services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grocery_booking_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: grocery_booking
      DB_USERNAME: grocery_user
      DB_PASSWORD: grocery_secret_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grocery_network

  web:
    image: nginx:alpine
    container_name: grocery_booking_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - grocery_network

  db:
    image: mysql:8.0
    container_name: grocery_booking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grocery_booking
      MYSQL_USER: grocery_user
      MYSQL_PASSWORD: grocery_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - grocery_db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-testing-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grocery_network

networks:
  grocery_network:
    driver: bridge

volumes:
  grocery_db_data:
    driver: local
